[project]
name = "KG2BM"
version = "0.0.1" 
description = "Automating the Construction of Contextual Knowledge Graphs (using ontoweaver) for Boolean Modeling in Systems Biomedicine. M2 internship project with Institut de Mathémathique de Marseille (I2M) collaborating with Institut Pasteur (Paris)."
authors = [
    {name = "Nina Alger", email = "nina.alger@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
  "ontoweaver>=1.5.3,<2.0.0",
  "pandas>=2.3.1,<3.0",
  "notebook>=7.4.3",
  "biocypher>=0.11.0,<1.0.0",
  "ipykernel>=7.1,<8.0",
  "pandas-stubs>=2.3.3",
  "pyarrow<21.0.0",
  "nekomata",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "sphinx_rtd_theme>=3.0.2",
]

[tool.uv.sources]
nekomata = { git = "https://github.com/njmmatthieu/Neko.git", branch = "neko-uv"}