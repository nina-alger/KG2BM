row:
    split:
        column: chemblIds # [numpy.darray - shape (n,)]
        to_subject: drug

transformers:
    - split:
        column: targets  # [numpy.darray - shape (n,)]
        to_object: gene
        via_relation: drug_has_target
    # - map:
    #     column: targetName
    #     to_property: name
    #     for_object: gene
    - map:
        column: actionType
        to_property: action_type
        for_relation: drug_has_target
    - replace:
        column: mechanismOfAction
        to_property: mechanism_of_action
        for_relation: drug_has_target
        forbidden: "'"
    - urls_to_prop:  # Aggregate all the URLs in one list.
        column: references
        to_property: references
        for_relation: drug_has_target
        key: urls

metadata:
        - data_source: open_targets_drug_mechanism_of_action